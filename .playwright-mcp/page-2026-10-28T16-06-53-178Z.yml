      - generic [ref=e58]:
        - generic [ref=e59]: TEDx · Universidad Panamericana Guadalajara
        - heading "There's no prosthesis for an amputated spirit" [level=2] [ref=e168]
        - generic [ref=e61]:
          - paragraph [ref=e169]: When we face loss, crisis, or deep change, we tend to focus on what happened on the outside. But the hardest battles are fought somewhere else — in our beliefs, our fears, our hope, and our ability to imagine a different future.
          - paragraph [ref=e170]: "Built around the powerful analogy in its title, this TEDx Talk explores what no prosthesis can replace: the will to keep going, the ability to adapt, and the choice not to let circumstances define how we live, dream, and find meaning. An invitation to discover the strength that surfaces when everything seems broken."
        - link "Watch TED →" [ref=e171] [cursor=pointer]:
