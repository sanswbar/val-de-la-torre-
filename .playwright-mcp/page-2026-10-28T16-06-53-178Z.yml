  - region [ref=e157]:
    - generic [ref=e18]:
      - img "Valeria de la Torre" [ref=e20]
      - generic [ref=e21]:
        - heading "Who I am" [level=2] [ref=e158]
        - paragraph [ref=e23]: I'm Valeria de la Torre — speaker, content creator, and deeply passionate about stories of human transformation. For years, I found in the mountains, travel, and movement a way to explore my limits and discover what I was capable of. In 2024, an accident changed my life forever and forced me to rebuild it from scratch.
        - paragraph [ref=e24]: "That process led me to rethink some of the most important questions we can ask ourselves: who we are when life changes our plans, how we face uncertainty, and what allows us to keep going when the path gets hard. Since then, I have dedicated my work to sharing those reflections through talks, content, and conversations that seek to inspire, support, and offer new perspectives on adversity, adaptation, and growth."
        - paragraph [ref=e25]: Today I continue building a life full of challenges, learning, and new dreams. I deeply believe in the human capacity to rebuild, in the power of community, and in the idea that our most difficult experiences often end up revealing strengths we never knew we had.
