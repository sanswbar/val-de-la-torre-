        - generic [ref=f1e80]: TEDx · Universidad Panamericana Guadalajara
        - heading "No hay prótesis para un espíritu amputado" [level=2] [ref=f1e81]
        - generic [ref=f1e82]:
          - paragraph [ref=f1e83]: "Cuando enfrentamos una pérdida, una crisis o un cambio profundo, solemos enfocarnos en aquello que ocurrió por fuera. Sin embargo, las batallas más difíciles suelen librarse en otro lugar: en nuestras creencias, nuestros miedos, nuestra esperanza y nuestra capacidad de imaginar un futuro distinto."
          - paragraph [ref=f1e84]: "A partir de la poderosa analogía detrás de su título, esta TEDx Talk reflexiona sobre aquello para lo que no existen prótesis ni soluciones externas: la voluntad de seguir adelante, la capacidad de adaptarnos y la decisión de no permitir que las circunstancias amputen nuestra forma de vivir, soñar y encontrar sentido. Una invitación a explorar la fortaleza humana que emerge cuando todo parece haberse roto."
        - link "Ver TED →" [ref=f1e85] [cursor=pointer]:
